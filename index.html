<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SUUQ SOMALILAND</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:25px 18px 28px;
  border-radius:0 0 28px 28px;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  line-height:1.4;
  opacity:.95;
}

.search{
  margin-top:18px;
  width:100%;
  padding:15px 17px;
  border:0;
  border-radius:15px;
  font-size:16px;
  outline:none;
}

.container{
  padding:20px 16px 100px;
}

.title{
  font-size:23px;
  font-weight:900;
  margin-bottom:14px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  border:0;
  background:white;
  border-radius:15px;
  padding:13px 17px;
  white-space:nowrap;
  box-shadow:0 3px 12px #00000012;
  font-weight:800;
  color:#172033;
  font-size:14px;
}

.category.active{
  background:#2563eb;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:16px;
}

.card{
  background:white;
  border-radius:19px;
  overflow:hidden;
  box-shadow:0 4px 15px #00000012;
  position:relative;
}

.product-image{
  height:135px;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
}

.info{
  padding:13px;
}

.name{
  font-weight:900;
  font-size:16px;
  line-height:1.3;
}

.price{
  color:#2563eb;
  font-weight:900;
  font-size:18px;
  margin-top:7px;
}

.location{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.favorite{
  position:absolute;
  right:9px;
  top:9px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:20px;
  box-shadow:0 2px 8px #00000018;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
  color:#6b7280;
  font-weight:700;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
  box-shadow:0 -3px 15px #00000010;
}

.nav-btn{
  border:0;
  background:none;
  color:#6b7280;
  font-size:12px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:7px 12px;
}

.nav-btn span{
  font-size:22px;
}

.nav-btn.active{
  color:#2563eb;
}

.add-button{
  width:54px;
  height:54px;
  border-radius:50%;
  border:0;
  background:#2563eb;
  color:white;
  font-size:30px;
  margin-top:-25px;
  box-shadow:0 5px 15px #2563eb55;
}
