<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUUQ SOMALILAND</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #172033;
}

header {
  background: linear-gradient(135deg, #111827, #2563eb);
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 25px 25px;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.subtitle {
  margin-top: 6px;
  opacity: .9;
}

.search {
  margin-top: 18px;
  width: 100%;
  padding: 14px 16px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

.container {
  padding: 20px 16px 90px;
}

.title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 14px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.category {
  background: white;
  border-radius: 14px;
  padding: 12px 17px;
  white-space: nowrap;
  box-shadow: 0 3px 12px #00000012;
  font-weight: 700;
}

.products {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 15px #00000012;
}

.product-image {
  height: 130px;
  background: linear-gradient(135deg, #dbeafe, #eff6ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.info {
  padding: 12px;
}

.name {
  font-weight: 800;
  font-size: 16px;
}

.price {
  color: #2563eb;
  font-weight: 800;
  margin-top: 7px;
}

.location {
  color: #6b7280;
  font-size: 13px;
  margin-top: 5px;
}

.button {
  display: block;
  width: 100%;
  border: none;
  background: #2563eb;
  color: white;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  font-weight: 700;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav {
  text-align: center;
  color: #6b7280;
  font-size: 12px;
}

.nav.active {
  color: #2563eb;
  font-weight: 800;
}

.nav-icon {
  font-size: 23px;
  display: block;
  margin-bottom: 2px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SUUQ SOMALILAND</div>
  <div class="subtitle">Suuqa online-ka Somaliland</div>

  <input
    class="search"
    type="text"
    placeholder="🔎 Raadi alaab ama adeeg..."
  >
</header>

<div class="container">

  <div class="title">Qaybaha Suuqa</div>

  <div class="categories">
    <div class="category">Dhammaan</div>
    <div class="category">📱 Electronics</div>
    <div class="category">🚗 Gaadiid</div>
    <div class="category">🏠 Guryo</div>
    <div class="category">👕 Dharka</div>
  </div>

  <div class="title" style="margin-top:25px;">
    Alaabaha Cusub
  </div>

  <div class="products">

    <div class="card">
      <div class="product-image">📱</div>
      <div class="info">
        <div class="name">Smart Phone</div>
        <div class="price">$250</div>
        <div class="location">📍 Hargeysa</div>
        <button class="button">Eeg Faahfaahin</button>
      </div>
    </div>

    <div class="card">
      <div class="product-image">💻</div>
      <div class="info">
        <div class="name">Laptop</div>
        <div class="price">$450</div>
        <div class="location">📍 Burco</div>
        <button class="button">Eeg Faahfaahin</button>
      </div>
    </div>

    <div class="card">
      <div class="product-image">🚗</div>
      <div class="info">
        <div class="name">Gaari</div>
        <div class="price">$8,500</div>
        <div class="location">📍 Hargeysa</div>
        <button class="button">Eeg Faahfaahin</button>
      </div>
    </div>

    <div class="card">
      <div class="product-image">🏠</div>
      <div class="info">
        <div class="name">Guri</div>
        <div class="price">$35,000</div>
        <div class="location">📍 Burco</div>
        <button class="button">Eeg Faahfaahin</button>
      </div>
    </div>

  </div>
</div>

<div class="bottom">
  <div class="nav active">
    <span class="nav-icon">🏠</span>
    Home
  </div>

  <div class="nav">
    <span class="nav-icon">🔎</span>
    Raadi
  </div>

  <div class="nav">
    <span class="nav-icon">➕</span>
    Iibso
  </div>

  <div class="nav">
    <span class="nav-icon">❤️</span>
    Favorites
  </div>

  <div class="nav">
    <span class="nav-icon">👤</span>
    Account
  </div>
</div>

</body>
</html>
